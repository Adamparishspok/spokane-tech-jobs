    <!-- Organization and WebSite, which are the two things true of this site
         no matter what the database holds. Per-company and per-job JSON-LD
         belongs on per-company and per-job pages, which do not exist yet. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://spokanetechjobs.com/#website",
            "url": "https://spokanetechjobs.com/",
            "name": "Spokane Tech Jobs",
            "description": "A directory and job board for the Spokane tech ecosystem.",
            "inLanguage": "en-US"
          },
          {
            "@type": "Organization",
            "@id": "https://spokanetechjobs.com/#organization",
            "name": "Spokane Tech Jobs",
            "url": "https://spokanetechjobs.com/",
            "areaServed": {
              "@type": "Place",
              "name": "Spokane, Washington and the Inland Northwest"
            }
          }
        ]
      }
    </script>
    <!-- The kit ships no Preflight on purpose (its styles are also compiled
         into the landing site, where a global reset would flatten that page's
         own typography), and its own reset is scoped to [data-proto] — which
         cannot reach <body>. Standalone, that leaves the UA's 8px body margin
         under an app whose map is supposed to run to the edge of the window.
         So the one rule Preflight would have given us lives here, in the only
         document that needs it. -->
    <style>
      body {
        margin: 0;
      }
    </style>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap"
    />
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://spokanetechjobs.com/#website",
            "url": "https://spokanetechjobs.com/",
            "name": "Spokane Tech Jobs",
            "description": "A directory and job board for the Spokane tech ecosystem — the companies hiring across the Inland Northwest, the roles they have open, and the people building here, on one map.",
            "inLanguage": "en-US"
          },
          {
            "@type": "Dataset",
            "@id": "https://spokanetechjobs.com/#dataset",
            "name": "Spokane Tech Jobs directory",
            "description": "Spokane-area technology employers with location, industry and open roles. Every field is sourced from public records; a fact nobody published is null rather than estimated.",
            "url": "https://spokanetechjobs.com/",
            "license": "https://creativecommons.org/licenses/by/4.0/",
            "isAccessibleForFree": true,
            "creator": { "@type": "Organization", "name": "Spokane Tech Jobs" },
            "spatialCoverage": { "@type": "Place", "name": "Spokane, Washington, United States" },
            "distribution": [
              {
                "@type": "DataDownload",
                "encodingFormat": "application/json",
                "contentUrl": "https://spokanetechjobs.com/data/companies.json"
              },
              {
                "@type": "DataDownload",
                "encodingFormat": "text/plain",
                "contentUrl": "https://spokanetechjobs.com/llms-full.txt"
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      The app is a map that draws itself from the API, so a crawler running no
      JavaScript would otherwise find an empty page and no way into a company.
      These are the same rows, written out by `bun run db:export`: one static
      page each, the data as JSON, and the directory in plain text. The app
      hides this block once it mounts; it is for readers without JavaScript and
      for crawlers, and it is real content rather than a redirect.
    -->
    <noscript>
      <nav>
        <h1>Spokane Tech Jobs</h1>
        <p>
          A directory of the Spokane, Washington tech ecosystem. Open data,
          CC BY 4.0.
        </p>
        <ul>
          <li><a href="/companies/">Every company, one page each</a></li>
          <li><a href="/data/companies.json">The directory as JSON</a></li>
          <li><a href="/llms-full.txt">The directory as plain text</a></li>
        </ul>
      </nav>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
